name: Assemble raw

on:
  workflow_dispatch:
  push:

jobs:
  build-plugins:
    name: Assemble project Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Modify gradlew permissions
        run: chmod +x ./gradlew

      - name: Assemble all
        run: ./gradlew assemble
